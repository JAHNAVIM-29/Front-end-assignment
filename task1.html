<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Showcase Card</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
    padding: 30px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Mobile First */
.component-container {
    width: 100%;
    max-width: 900px;
}

.product-card {
    display: grid;
    grid-template-columns: 1fr;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.product-image {
    width: 100%;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.product-image img:hover {
    transform: scale(1.04);
}

.product-details {
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 20px;
}

.top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.category {
    color: #64748b;
    font-size: 14px;
}

.rating {
    color: #f59e0b;
    font-weight: bold;
}

h2 {
    font-size: 25px;
    margin-top: 15px;
}

.description {
    color: #64748b;
    margin-top: 10px;
    line-height: 1.6;
}

.features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.features span {
    background: #e0f2fe;
    color: #0369a1;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
}

.bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.price {
    font-size: 25px;
    font-weight: bold;
}

.tax {
    color: #64748b;
    font-size: 12px;
    margin-top: 5px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button:active {
    transform: scale(0.96);
}

/* Desktop View */
@media (min-width: 768px) {
    .product-card {
        grid-template-columns: 1fr 1fr;
    }

    .product-image img {
        height: 100%;
        min-height: 380px;
    }
}
</style>
</head>

<body>

<main class="component-container">

<div class="product-card">

    <div class="product-image">
        <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?w=800"
             alt="Desk Workspace Mat">
    </div>

    <div class="product-details">

        <div>
            <div class="top-row">
                <span class="category">POPULAR</span>
                <span class="rating">4.9 ★</span>
            </div>

            <h2>Desk Workspace Mat</h2>

            <p class="description">
                Upgrade your workspace with this stylish and
                comfortable desk mat. Perfect for everyday use.
            </p>
        </div>

        <div class="features">
            <span>Water Resistant</span>
            <span>Non-Slip</span>
            <span>Premium Quality</span>
        </div>

        <div class="bottom-row">
            <div>
                <div class="price">₹1,499</div>
                <div class="tax">Tax included</div>
            </div>

            <button>Add to Bag</button>
        </div>

    </div>

</div>

</main>
</body>
</html>
